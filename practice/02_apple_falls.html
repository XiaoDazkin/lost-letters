<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        
        let appleY = 0;
        let appleX = 0;

        function loop() {
            
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, 800, 600)
            ctx.fillStyle = "limegreen";
            ctx.fillRect(0, 500, 800, 100)

            appleY = appleY + 3;

            if (appleY > 500){
                appleY = 0;
                appleX = 100 + Math.random() * 600;
            }

            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(appleX, appleY, 25, 0, Math.PI * 2);
            ctx.fill();
            
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
</html>

<!-- 
appleY is how far down the apple is. Adding 3 every frame makes it fall (about 180 px a second).
Circles take 3 steps: beginPath() starts a new shape, arc(x, y, radius, start, end) traces the circle, and fill() paints it in.
0, Math.PI * 2 means “go all the way round”, a full 360°.
 -->
