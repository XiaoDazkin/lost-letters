<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>
    <video id="cam" autoplay playsinline muted style="display: none"></video>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const video = document.getElementById("cam");

        navigator.mediaDevices.getUserMedia({ video:true})
        .then(function (stream){
            video.srcObject = stream;
            video.play();
        });

        function loop() {
            ctx.save();
            ctx.translate(800, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 800, 600);
            ctx.restore();

            const frame = ctx.getImageData(0, 0, 800, 600);
            const data = frame.data;

            let sumX = 0;
            let sumY = 0;
            let count = 0;

            for(let i = 0; i < data.length; i += 4){
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                if(r > g + 120 && r > b + 120){
                    data[i] = 0;
                    data[i + 1] = 255;
                    data[i + 2] = 0;

                    const pixel = i / 4;
                    const x = pixel % 800;
                    const y = Math.floor(pixel / 800);

                    sumX += x;
                    sumY += y;
                    count += 1;
                }
            }
            ctx.putImageData(frame, 0, 0); //repaint

            if(count > 0){
                ctx.fillStyle = "yellow";
                ctx.beginPath();

                ctx.arc(sumX/count, sumY/count, 25, 0, Math.PI * 2);
                ctx.fill();
            }
            
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
