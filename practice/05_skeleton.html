<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>
    <video id="cam" autoplay playsinline muted style="display: none"></video>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const video = document.getElementById("cam");
        
        let title = "Lost Letters";
        let screen = "title";
        let basketX = 400;
        let score = 0;
        let apples = [{x: 0, y: -10, speed: 2 + Math.random() * 3, hover: false, hold: 0}, {x: 0, y: -5, speed: 2 + Math.random() * 5, hover: false, hold: 0}, {x: 0, y: -15, speed: 2 + Math.random() * 2, hover: false, hold: 0}];
        let circleX = 400;
        let circleY = 300;
        let circleR = 80;
        let scanTimer = 0;
        let wandColor = null;
        let tolerance = 60;
        let wandX = 400;
        let wandY = 300;
        let miniPixels = 50;
        let wandLost = false;
        let searchR = 150;
        let smooth = 0.3;
        let grabR = 40;
        let grabTime = 30;

        canvas.addEventListener("click", function (event) {
            if(screen == "title"){
                screen = "scan";
                scanTimer = 0;
                startCamera();
            }
        })

        function findWand(){
            ctx.save();
            ctx.translate(800, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 800, 600);
            ctx.restore();

            const frame = ctx.getImageData(0, 0, 800, 600);
            const data = frame.data;
            let count = 0;
            let sumX = 0;
            let sumY = 0;

            for (let i = 0; i < data.length; i += 4){
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const diff = Math.abs(r - wandColor.r) + Math.abs(g - wandColor.g) + Math.abs(b - wandColor.b);
                
                const pixel = i / 4;
                const x = pixel % 800;
                const y = Math.floor(pixel / 800);

                const dx = x - wandX;
                const dy = y - wandY;
                const near = dx * dx + dy * dy < searchR * searchR;

                if (diff < tolerance && (near || wandLost == true)){
                    count += 1;
                    sumX += x;
                    sumY += y;
                }
            }

            if (count < miniPixels){
                wandLost = true;
            } else {
                wandLost = false;

                const targetX = sumX / count;
                const targetY = sumY / count;

                wandX = wandX + (targetX - wandX) * smooth;
                wandY = wandY + (targetY - wandY) * smooth;
            }
        }

        function startCamera(){

            navigator.mediaDevices.getUserMedia({ video:true}).then(function (stream){
            video.srcObject = stream;
            video.play();
            });
        }

        function drawTitle(){
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, 800, 600)

            ctx.fillStyle = "black";
            ctx.font = "60px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(title, 400, 100)

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Click to play", 400, 400)
        }

        function drawScan(){
            ctx.save();
            ctx.translate(800, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 800, 600);
            ctx.restore();

            const box = ctx.getImageData(circleX - circleR, circleY - circleR, circleR * 2, circleR * 2)
            const data = box.data;

            let sumR = 0;
            let sumG = 0;
            let sumB = 0;
            let count = 0;

            for (let i = 0; i < data.length; i += 4){
                const pixel = i / 4;
                const x = pixel % (circleR * 2);
                const y = Math.floor(pixel / (circleR * 2));

                const dx = x - circleR;
                const dy = y - circleR;

                if(dx * dx + dy * dy <  circleR * circleR){
                    sumR += data[i];
                    sumG += data[i + 1];
                    sumB += data[i + 2];
                    count += 1;

                    //data[i] = 0;
                    //data[i + 1] = 255;
                    //data[i + 2] = 0;
                }
            }
            //ctx.putImageData(box, circleX - circleR, circleY - circleR);
            if(video.videoWidth > 0){
                scanTimer += 1;
            }

            const avgR = Math.round(sumR/count);
            const avgG = Math.round(sumG/count);
            const avgB = Math.round(sumB/count);

            if(scanTimer >= 180){
                wandColor = {r: avgR, g: avgG, b: avgB};
                screen = "play";
                console.log(wandColor);
            }

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Scan your wand!", 400, 200)

            const secondsLeft = Math.ceil((180 - scanTimer) / 60);
            ctx.fillText(secondsLeft, 400, 450);

            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgb("+ avgR + "," + avgG + "," + avgB + ")";
            ctx.fillRect(20, 20, 60, 60);
        }

        function resetApple(a){
            a.y = Math.random() * -50;
            a.x = 100 + Math.random() * 600;
        }

        function update(){
            for (let a of apples){
                a.y = a.y + a.speed;

                const dx = a.x - wandX;
                const dy = a.y - wandY;
                a.hover = dx * dx + dy * dy < grabR * grabR;
                
                if(a.hover == true){
                    a.hold += 1;
                } else {
                    a.hold = 0;
                }
            
                if(a.y > 470 && a.x > basketX - 50 && a.x < basketX + 50){
                    score += 1;
                    resetApple(a);
                }

                if (a.y > 500){
                    resetApple(a);
                }
            }
        }

        function draw(){
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, 800, 600)

            ctx.fillStyle = "limegreen";
            ctx.fillRect(0, 500, 800, 100)

            for (let a of apples){
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(a.x, a.y, 25, 0, Math.PI * 2);
                ctx.fill();

                if (a.hover == true){
                    ctx.strokeStyle = "gold";
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    const progress = a.hold / grabTime;
                    ctx.arc(a.x, a.y, grabR, -Math.PI / 2, - Math.PI/ 2 + Math.PI * 2 * progress);
                    ctx.stroke();
                }
            }
            ctx.fillStyle = "saddlebrown";
            ctx.fillRect(basketX - 50, 470, 100, 30);

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("Score: " + score, 20, 40);

            if (wandLost == true){
                ctx.fillStyle = "rgb(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, 800, 600);
                ctx.fillStyle = "white";
                ctx.font = "50px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Where's your wand?", 400, 300);
            } else {
                ctx.fillStyle = "blue";
                ctx.beginPath();
                ctx.arc(wandX, wandY, 15, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            if (screen == "title"){
                drawTitle();
            } else if (screen == "scan"){
                drawScan();
            } else if(screen == "play"){
                findWand();
                if(wandLost == false){
                    update();
                }
                draw();
            }
            requestAnimationFrame(loop);
        }
        for (let a of apples){
            resetApple(a);
        }
        loop();   
    </script>

</body>
</html>
