        // 🗺️ Which land are we in? (0–3)
        function landNow(){
            return Math.floor((level - 1) / 2);
        }

        // ✏️ Write long text over several lines
        function drawWrapped(text, x, y, maxW, lineH){
            const parts = text.split(" ");
            let line = "";
            for (let p of parts){
                const test = line + p + " ";
                if (ctx.measureText(test).width > maxW && line != ""){
                    ctx.fillText(line, x, y);
                    line = p + " ";
                    y += lineH;
                } else {
                    line = test;
                }
            }
            ctx.fillText(line, x, y);
        }

        // 📚 Words with the right length for this level
        function wordPool(){
            const min = lens[level - 1][0];
            const max = lens[level - 1][1];
            const pool = [];
            for(let w of words){
                if (w.word.length >= min && w.word.length <= max){
                    pool.push(w);
                }
            }
            return pool;
        }

        // 🖼️ Find the picture for a word
        function picOf(word){
            for (let w of words){
                if (w.word == word){
                    return w.pic;
                }
            }
        }

        // 🛡️ Is a made-up word safe for kids?
        function isSafe(text, real){
            for (let bad of notForKids){
                if (text.includes(bad) && !real.includes(bad)){
                    return false;
                }
            }
            return true;
        }

        // ✏️ Make a believable wrong spelling
        function misspell(word){
            let s = word;
            while (s == word || !isSafe(s, word)){
                if (Math.random() < 0.5){
                    // swap: letters i and i+1
                    const i = Math.floor(Math.random() * (word.length - 1));
                    s = word.slice(0, i) + word[i + 1] + word[i] + word.slice(i + 2);
                } else {
                    // double: letter i twice
                    const i = Math.floor(Math.random() * word.length);
                    s = word.slice(0, i) + word[i] + word.slice(i);
                }
            }
            return s;
        }

        // 🔀 Mix up the letters of a word
        function scramble(word){
            let s = word;
            while (s == word){
                const letters = word.split("");
                let out = "";
                while (letters.length > 0){
                    const i = Math.floor(Math.random() * letters.length);
                    out += letters[i];
                    letters.splice(i, 1);
                }
                s = out;
            }
            return s;
        }

        // 🪄 Find the wand colour in the camera picture
        function findWand(){
            ctx.save();
            ctx.translate(800, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 800, 600);
            ctx.restore();

            // check every pixel near the wand
            const frame = ctx.getImageData(0, 0, 800, 600);
            const data = frame.data;
            let count = 0;
            let sumX = 0;
            let sumY = 0;

            for (let i = 0; i < data.length; i += 4){
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const diff = Math.abs(r - wandColor.r) + Math.abs(g - wandColor.g) + Math.abs(b - wandColor.b);
                
                const pixel = i / 4;
                const x = pixel % 800;
                const y = Math.floor(pixel / 800);

                const dx = x - wandX;
                const dy = y - wandY;
                const near = dx * dx + dy * dy < searchR * searchR;

                if (diff < tolerance && (near || wandLost == true)){
                    count += 1;
                    sumX += x;
                    sumY += y;
                }
            }

            // lost or found? smooth the movement
            const wasLost = wandLost;

            if (count < miniPixels){
                wandLost = true;
            } else {
                wandLost = false;

                const targetX = sumX / count;
                const targetY = sumY / count;

                wandX = wandX + (targetX - wandX) * smooth;
                wandY = wandY + (targetY - wandY) * smooth;
            }

            // say it only once, when it gets lost
            if(wandLost == true && wasLost == false){
                say("Where's your wand?");
            }
        }

        // 📷 Turn on the webcam (only once)
        function startCamera(){
            if(video.srcObject){
                return;
            }
            navigator.mediaDevices.getUserMedia({ video:true}).then(function (stream){
            video.srcObject = stream;
            video.play();
            });
        }

        // 🗣️ What Pip says for this question
        function questionText(){
            const q = questions[current];
            if (q.type == "spell"){
                return "Which one spells " + q.word + "?";
            }
            if (q.type == "listen"){
                return "Listen! Find the word " + q.word;
            }
            if(q.type == "missing"){
                return "Which letter is missing in " + q.full + "?";
            }
            if (q.type == "unscramble"){
                return "Unscramble the letters!";
            }
            if (q.type == "rhyme"){
                 return "Which word rhymes with " + q.shown + "?"; 
            }
            if(q.ask){
                return q.ask;
            }
            return "Can you find the " + q.word + "?";
        }

        // 📖 3 word questions (picture / listen / missing / unscramble/ rhyme)
        function makeWordSet(){
            const pool = wordPool();
            const set = [];
            const picked = [];
            while (set.length < 3){
                const w = pool[Math.floor(Math.random() * pool.length)];
                if(!picked.includes(w.word)){
                    picked.push(w.word);
                    const q = {word: w.word, pic: w.pic, type: "picture"};
                    // roll the dice for the puzzle type
                    const types = levelTypes[level - 1];
                    const kind = types[Math.floor(Math.random() * types.length)];
                    if (kind == "listen"){
                        q.type = "listen";
                    } else if (kind == "missing"){
                        const i = Math.floor(Math.random() * w.word.length);  
                        q.type = "missing";
                        q.full = w.word;
                        q.word = w.word[i];
                        q.shown = w.word.slice(0, i) + "_" + w.word.slice(i + 1);
                    } else if (kind == "unscramble"){
                        q.type = "unscramble";
                        q.shown = scramble(w.word);
                    } else if (kind == "rhyme"){
                        const g = rhymes[Math.floor(Math.random() * rhymes.length)];
                        const a = g[Math.floor(Math.random() * g.length)];
                        let b = a;
                        while (b == a){
                            b = g[Math.floor(Math.random() * g.length)];
                        }
                        q.type = "rhyme";
                        q.shown = a;
                        q.pic = picOf(a);
                        q.word = b;
                        q.group = g;
                    } else if (kind == "spell"){
                        q.type = "spell";
                    }
                    set.push(q);
                }
            }
            return set;
        }

        // 🎲 Next 3 questions: words or maths
        function nextSet(){
            if (mode == "maths"){
                return makeMathsSet();
            }
            return makeWordSet();
        }

        // 📷 Scan screen: learn the wand colour
        function drawScan(){
            ctx.save();
            ctx.translate(800, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 800, 600);
            ctx.restore();

            const box = ctx.getImageData(circleX - circleR, circleY - circleR, circleR * 2, circleR * 2)
            const data = box.data;

            // average colour inside the circle
            let sumR = 0;
            let sumG = 0;
            let sumB = 0;
            let count = 0;

            for (let i = 0; i < data.length; i += 4){
                const pixel = i / 4;
                const x = pixel % (circleR * 2);
                const y = Math.floor(pixel / (circleR * 2));

                const dx = x - circleR;
                const dy = y - circleR;

                if(dx * dx + dy * dy <  circleR * circleR){
                    sumR += data[i];
                    sumG += data[i + 1];
                    sumB += data[i + 2];
                    count += 1;

                    //data[i] = 0;
                    //data[i + 1] = 255;
                    //data[i + 2] = 0;
                }
            }
            //ctx.putImageData(box, circleX - circleR, circleY - circleR);
            if(video.videoWidth > 0){
                scanTimer += 1;
            }

            const avgR = Math.round(sumR/count);
            const avgG = Math.round(sumG/count);
            const avgB = Math.round(sumB/count);

            // 3 seconds done → save colour, start the story
            if(scanTimer >= 180){
                wandColor = {r: avgR, g: avgG, b: avgB};
                screen = "levelup";
                levelTimer = 360;
                say("Welcome to the " + lands[landNow()].name + "!");
            }

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Scan your wand!", 400, 200);

            const secondsLeft = Math.ceil((180 - scanTimer) / 60);
            ctx.fillText(secondsLeft, 400, 450);

            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgb("+ avgR + "," + avgG + "," + avgB + ")";
            ctx.fillRect(20, 20, 60, 60);
        }

        // ⭐ Level complete / new land story card
        function drawLevelUp(){

            ctx.fillStyle = "gold";
            ctx.fillRect(0, 0, 800, 600);

            ctx.fillStyle = "white";
            ctx.font = "40px sans-serif";
            ctx.textAlign = "center";

                ctx.fillText("🦊 " + lands[landNow()].friend, 400, 170);
                ctx.font = "40px sans-serif";
                ctx.fillText("Welcome to the " + lands[landNow()].name + "!", 400, 300);
                ctx.font = "24px sans-serif";
                drawWrapped(lands[landNow()].story, 400, 420, 600, 32);
                ctx.font = "40px sans-serif";
            } else {
                ctx.fillText("Level complete!", 400, 300);
            }
            ctx.fillText("Level " + level, 400, 360);
            // count down, then back to play
            levelTimer -= 1;
            if(levelTimer <= 0){
                screen = "play";
                for (let a of apples){
                    resetApple(a);
                }
                say(questionText());
            }
        }

                ctx.fillText(lands[i].icon, 160 + i * 120, 260);

            ctx.fillText("🏡", 640, 260);

            ctx.fillText("Mistakes: " + mistakes, 400, 390);

            ctx.fillStyle = "pink";
            ctx.fillRect(290, 470, 220, 100);
            ctx.strokeStyle = "hotpink";
            ctx.lineWidth = 4;
            ctx.strokeRect(290, 470, 220, 100);
            ctx.fillStyle = "white";
            ctx.font = "40px sans-serif";
            ctx.fillText("Play again", 400, 520);
        }

        // 🍎 Send an apple back to the top
        function resetApple(a){
            a.y = Math.random() * -50;
            a.x = 100 + Math.random() * 600;
        }

        // 🔊 Pip talks
        function say(text){
            if (soundOn == false){
                return;
            }
            speechSynthesis.cancel();
            const line = new SpeechSynthesisUtterance(text);
            line.rate = 0.9;
            speechSynthesis.speak(line);
        }

        // 🍎 Put the right answer + 2 wrong ones on the apples
        function dealWords(){
            const right = questions[current].word;
            const lucky = Math.floor(Math.random() * apples.length);
            const used = [right];

            for(let i = 0; i < apples.length; i += 1){
                if (i == lucky){
                    apples[i].word = right;
                } else {
                    let w = pickWrong();
                    while (used.includes(w)){
                        w = pickWrong();
                    }
                    used.push(w);
                    apples[i].word = w;
                }
            }
        }
        
        // ➕ 3 maths questions (count / add / subtract)
        function makeMathsSet(){
            const set = [];
            for (let i = 0; i < 3; i += 1){
                const types = levelMaths[level - 1];
                const kind = types[Math.floor(Math.random() * types.length)];
                if (kind == "count"){
                    const n = 2 + Math.floor(Math.random() * 5);
                    set.push({
                        word: String(n), 
                        pic: "🍎".repeat(n), 
                        ask: "How many apples?", 
                        type: "maths"
                    });
                } else if (kind == "add"){
                    const a = 1 + Math.floor(Math.random() * 5);
                    const b = 2 + Math.floor(Math.random() * 4);
                    set.push({
                        word: String(a + b),
                        pic: a + " + " + b,
                        ask: "What is " + a + " plus " + b + "?",
                        type: "maths"
                    });
                } else {
                    const a = 4 + Math.floor(Math.random() * 6); 
                    const b = 1 + Math.floor(Math.random() * 3);
                    set.push({
                        word: String(a - b), 
                        pic: a + " − " + b, 
                        ask: "What is " + a + " take away " + b + "?", 
                        type: "maths"
                    });
                }
            }
            return set;
        }

        // ❌ Pick one wrong answer
        function pickWrong(){
            const right = questions[current].word;

            if(questions[current].type == "spell"){
                return misspell(right);
            }
            // wrong letter
            if (questions[current].type == "missing"){
                const abc = "abcdefghijklmnopqrstuvwxyz";
                let w = right;
                while(w == right){
                    w = abc[Math.floor(Math.random() * abc.length)];
                }
                return w;
            }

            // wrong number
            if (questions[current].type == "maths"){
                let w = right;
                while(w == right){
                    w = String(1 + Math.floor(Math.random() * 10));
                }
                return w;
            }

            // wrong word that doesn't rhyme
            if (questions[current].type == "rhyme"){
                const pool = wordPool();
                let w = right;
                while (questions[current].group.includes(w)){
                    w = pool[Math.floor(Math.random() * pool.length)].word;
                }
                return w;
            }
            let w = right;
            // wrong word
            const pool = wordPool();
            while(w == right){
                w = pool[Math.floor(Math.random() * pool.length)].word;
            }
            return w;
        }

        // 🔄 Game logic every frame
        function update(){
            if (feedbackTimer > 0){
                feedbackTimer -= 1;
            }
            for (let a of apples){
                // carrying an apple
                if (a == heldApple){
                    a.x = wandX;
                    a.y = wandY;
                    // dropped in the basket
                    if(a.y > 450 && a.x > basketX - 50 && a.x < basketX + 50){
                        // ✅ right answer
                        if(a.word == questions[current].word){
                            score += 1;
                            current += 1;
                            feedbackText = "Great job!";
                            feedbackTimer = 60;

                            // level done
                            if(current >= questions.length){
                                current = 0;
                                level += 1;
                                if (level > maxLevel){
                                    screen = "end";
                                    say("You brought all the letters home! Hooray!");
                                } else { 
                                    questions = nextSet();
                                    screen = "levelup";
                                    if ((level - 1) % 2 == 0){
                                        levelTimer = 360;
                                        say("Welcome to the " + lands[landNow()].name + "!");
                                    } else {
                                        levelTimer = 120;
                                        say("Level complete!");
                                    }
                                }
                            } else {
                                say(feedbackText + " " + questionText());
                            }
                            dealWords();
                            resetApple(a);
                        } else {
                            // ❌ wrong answer
                            feedbackText = "Try again!";
                            feedbackTimer = 60;
                            a.rotten = true;
                            mistakes += 1;
                            say(feedbackText);
                        }
                        heldApple = null;
                    }
                } else {
                    // falling apple: speed up each level
                    let bonus = (level - 1) * speedUp;
                    if(hard){
                        bonus += 0.8;
                    }
                    a.y = a.y + a.speed + bonus;

                    // hover and grab
                    const dx = a.x - wandX;
                    const dy = a.y - wandY;
                    a.hover = heldApple == null && dx * dx + dy * dy < grabR * grabR && a.rotten == false;
                
                    if(a.hover == true){
                        a.hold += 1;
                    } else {
                        a.hold = 0;
                    }

                    if (a.hold >= grabTime && heldApple == null){
                        heldApple = a;
                        a.hold = 0;
                        a.hover = false;
                        say(a.word);
                    }


                    // hit the grass → back to the top
                    if (a.y > 500){
                        resetApple(a);
                        a.rotten = false;
                    }
                }
            }
        }

        // 🎨 Draw the play screen
        function draw(){
            // sky and grass
            ctx.fillStyle = lands[landNow()].sky;
            ctx.fillRect(0, 0, 800, 600);

            ctx.fillStyle = "limegreen";
            ctx.fillRect(0, 500, 800, 100);

            // Pip on the grass
            ctx.font = "60px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🦊", 60, 550);

            // progress bar
            const barX = 250;
            const barY = 15;
            const barW = 300;
            const barH = 20;

            ctx.fillStyle = "lightgray";
            ctx.fillRect(barX, barY, barW, barH);

            ctx.fillStyle = "gold";
            ctx.fillRect(barX, barY, barW * current / questions.length, barH);

            const q = questions[current];

            // 1. the picture
            ctx.fillStyle = "black";
            ctx.font = "80px sans-serif";
            ctx.textAlign = "center";
            if (q.type == "listen"){
                ctx.fillText("👂", 400, 100);
            } else if (q.type == "missing" || q.type == "unscramble" || q.type == "rhyme"){
                ctx.fillText(q.pic, 300, 100);
                ctx.font = "60px sans-serif";
                ctx.fillText(q.shown, 480, 100);
            } else {
                ctx.fillText(q.pic, 400, 100);
            }

            // 2. the prompt
            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            if (q.type == "maths"){
                ctx.fillText("Find the answer!", 400, 160);
            } else if (q.type == "listen"){
                ctx.fillText("Listen and find it!", 400, 160);
            } else if (q.type == "missing"){
                ctx.fillText("Find the missing letter!", 400, 160);
            }  else if (q.type == "unscramble"){
                ctx.fillText("Unscramble the letters!", 400, 160);
            } else if (q.type == "rhyme"){
                ctx.fillText("What rhymes with it?", 400, 160);
            } else if (q.type =="spell"){
                ctx.fillText("Which one is spelled right?", 400, 160);
            }else {
                ctx.fillText("What word is this?", 400, 160);
            }

            // apples: body, stem, leaf, word, grab ring
            for (let a of apples){
                if(a.rotten == true){
                    ctx.fillStyle = "sienna";
                } else{
                    ctx.fillStyle = "red";
                }
                ctx.beginPath();
                ctx.arc(a.x, a.y, 25, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "saddlebrown";
                ctx.fillRect(a.x - 2, a.y - 35, 4, 10);

                ctx.fillStyle = "green";
                ctx.beginPath();
                ctx.arc(a.x + 6, a.y - 30, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "white";
                ctx.font = "20px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(a.word, a.x, a.y);

                if (a.hover == true){
                    ctx.strokeStyle = "gold";
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    const progress = a.hold / grabTime;
                    ctx.arc(a.x, a.y, grabR, -Math.PI / 2, - Math.PI/ 2 + Math.PI * 2 * progress);
                    ctx.stroke();
                }
            }

            ctx.fillStyle = "saddlebrown";
            ctx.beginPath();
            // basket
            ctx.moveTo(basketX - 60, 470);
            ctx.lineTo(basketX + 60, 470);
            ctx.lineTo(basketX + 30, 510);
            ctx.lineTo(basketX - 30, 510);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "black";
            ctx.font = "40px sans-serif";
            ctx.textAlign = "left";
            // stars
            ctx.fillText("⭐: " + score, 20, 40);

            // Great job / Try again
            if (feedbackTimer > 0){
                if(feedbackText == "Great job!"){
                    ctx.fillStyle = "green";
                } else {
                    ctx.fillStyle = "red";
                }
                ctx.font = "50px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(feedbackText, 400, 300);
            }

            // wand lost overlay, or the blue wand dot
            if (wandLost == true){
                ctx.fillStyle = "rgb(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, 800, 600);
                ctx.fillStyle = "white";
                ctx.font = "50px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Where's your wand?", 400, 300);
            } else {
                ctx.fillStyle = "blue";
                ctx.beginPath();
                ctx.arc(wandX, wandY, 15, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 🔁 Main loop: run the right screen every frame
        function loop() {
            if (screen == "title"){
                drawTitle();
            } else if (screen == "scan"){
                drawScan();
            } else if(screen == "play"){
                findWand();
                if(wandLost == false){
                    update();
                }
                draw();
            } else if(screen == "levelup"){
                drawLevelUp();
            } else if(screen == "end"){
                drawEnd();
            }
            requestAnimationFrame(loop);
        }
        // ▶️ Start
        for (let a of apples){
            resetApple(a);
        }
        loop();   
    </script>
