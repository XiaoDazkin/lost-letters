<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        
        let basketX = 400;
        let score = 0;
        let apple = {x: 0, y: 0, speed: 3}

        canvas.addEventListener("mousemove", function (event) {
            basketX = event.offsetX;
        })

        function resetApple(){
            apple.y = 0;
            apple.x = 100 + Math.random() * 600;
        }

        function update(){
            apple.y = apple.y + apple.speed;
            
            if(apple.y > 470 && apple.x > basketX - 50 && apple.x < basketX + 50){
                score += 1;
                resetApple();
            }

            if (apple.y > 500){
                resetApple();
            }
        }

        function draw(){
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, 800, 600)

            ctx.fillStyle = "limegreen";
            ctx.fillRect(0, 500, 800, 100)

            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(apple.x, apple.y, 25, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "saddlebrown";
            ctx.fillRect(basketX - 50, 470, 100, 30);

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.fillText("Score: " + score, 20, 40);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        resetApple();
        loop();   
    </script>

</body>
</html>
