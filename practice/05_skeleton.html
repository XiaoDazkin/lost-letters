<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>
    <video id="cam" autoplay playsinline muted style="display: none"></video>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const video = document.getElementById("cam");
        
        let title = "Lost Letters";
        let screen = "title";
        let basketX = 400;
        let score = 0;
        let apples = [{x: 0, y: -10, speed: 2 + Math.random() * 3}, {x: 0, y: -5, speed: 2 + Math.random() * 5}, {x: 0, y: -15, speed: 2 + Math.random() * 2}];

        canvas.addEventListener("mousemove", function (event) {
            basketX = event.offsetX;
        })

        canvas.addEventListener("click", function (event) {
            if(screen == "title"){
                screen = "scan";
                startCamera();
            } else if(screen == "scan"){
                screen = "play";
            }
        })

        function startCamera(){

            navigator.mediaDevices.getUserMedia({ video:true}).then(function (stream){
            video.srcObject = stream;
            video.play();
            });
        }

        function drawTitle(){
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, 800, 600)

            ctx.fillStyle = "black";
            ctx.font = "60px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(title, 400, 100)

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Click to play", 400, 400)
        }

        function drawScan(){
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, 800, 600)

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Scan your wand!", 400, 200)
        }

        function resetApple(a){
            a.y = Math.random() * -50;
            a.x = 100 + Math.random() * 600;
        }

        function update(){
            for (let a of apples){
                a.y = a.y + a.speed;
            
                if(a.y > 470 && a.x > basketX - 50 && a.x < basketX + 50){
                    score += 1;
                    resetApple(a);
                }

                if (a.y > 500){
                    resetApple(a);
                }
            }
        }

        function draw(){
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, 800, 600)

            ctx.fillStyle = "limegreen";
            ctx.fillRect(0, 500, 800, 100)

            for (let a of apples){
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(a.x, a.y, 25, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = "saddlebrown";
            ctx.fillRect(basketX - 50, 470, 100, 30);

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("Score: " + score, 20, 40);
        }

        function loop() {
            if (screen == "title"){
                drawTitle();
            } else if (screen == "scan"){
                drawScan();
            } else if(screen == "play"){
                update();
                draw();
            }
            requestAnimationFrame(loop);
        }
        for (let a of apples){
            resetApple(a);
        }
        loop();   
    </script>

</body>
</html>
