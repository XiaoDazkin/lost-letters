<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        
        let basketX = 400;
        let score = 0;
        let apples = [{x: 0, y: -10, speed: 2 + Math.random() * 3}, {x: 0, y: -5, speed: 2 + Math.random() * 5}, {x: 0, y: -15, speed: 2 + Math.random() * 2}];

        canvas.addEventListener("mousemove", function (event) {
            basketX = event.offsetX;
        })

        function resetApple(a){
            a.y = Math.random() * -50;
            a.x = 100 + Math.random() * 600;
        }

        function update(){
            for (let a of apples){
                a.y = a.y + a.speed;
            
                if(a.y > 470 && a.x > basketX - 50 && a.x < basketX + 50){
                    score += 1;
                    resetApple(a);
                }

                if (a.y > 500){
                    resetApple(a);
                }
            }
        }

        function draw(){
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, 800, 600)

            ctx.fillStyle = "limegreen";
            ctx.fillRect(0, 500, 800, 100)

            for (let a of apples){
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(a.x, a.y, 25, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = "saddlebrown";
            ctx.fillRect(basketX - 50, 470, 100, 30);

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.fillText("Score: " + score, 20, 40);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        for (let a of apples){
            resetApple(a);
        }
        loop();   
    </script>

</body>
</html>
