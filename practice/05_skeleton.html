<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>
    <video id="cam" autoplay playsinline muted style="display: none"></video>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const video = document.getElementById("cam");
        
        let title = "Lost Letters";
        let screen = "title";
        let mode = "words";
        let basketX = 400;
        let score = 0;
        let apples = [{x: 0, y: -10, speed: 1 + Math.random() * 3, hover: false, hold: 0, word: "", rotten: false}, {x: 0, y: -5, speed: 1 + Math.random() * 5, hover: false, hold: 0, word: "", rotten: false}, {x: 0, y: -15, speed: 1 + Math.random() * 2, hover: false, hold: 0, word: "", rotten: false}];
        let circleX = 400;
        let circleY = 300;
        let circleR = 80;
        let scanTimer = 0;
        let wandColor = null;
        let tolerance = 60;
        let wandX = 400;
        let wandY = 300;
        let miniPixels = 50;
        let wandLost = false;
        let searchR = 150;
        let smooth = 0.3;
        let grabR = 40;
        let grabTime = 30;
        let heldApple = null;

        let wordSets = [
            [{word: "cat", pic: "🐱"}, {word: "dog", pic: "🐶"}, {word: "car", pic: "🚗"}],
            [{word: "sun", pic: "☀️"}, {word: "bus", pic: "🚌"}, {word: "hat", pic: "🎩"}],
            [{word: "pig", pic: "🐷"}, {word: "bee", pic: "🐝"}, {word: "fox", pic: "🦊"}]
        ];

        let current = 0;
        let feedbackText = "";
        let feedbackTimer = 0;
        let level = 1;
        let levelTimer = 0;
        let speedUp = 0.5;
        let skies = ["skyblue", "lavender", "powderblue", "peachpuff", "lightyellow"];
        let questions = wordSets[level - 1];
        let maxLevel = 5;
        let mistakes = 0;

        canvas.addEventListener("click", function (event) {
            const x = event.offsetX;
            const y = event.offsetY;

            if (screen == "title"){
                if (x > 150 && x < 150 + 220 && y > 250 && y < 250 + 100){
                    mode = "words";
                    questions = nextSet();
                    dealWords();
                    screen = "scan";
                    scanTimer = 0;
                    startCamera();
                } else if (x > 430 && x < 430 + 220 && y > 250 && y < 250 + 100){
                    mode = "maths";
                    questions = nextSet();
                    dealWords();
                    screen = "scan";
                    scanTimer = 0;
                    startCamera();
                } 
            } else if ( screen == "end"){
                if(x > 290 && x < 290 + 220 && y > 470 && y < 470 + 100){
                    score = 0;
                    level = 1;
                    current = 0;
                    mistakes = 0;
                    feedbackTimer = 0;
                    heldApple = null;
                    for (let a of apples){
                        resetApple(a);
                        a.rotten = false;
                    }
                    screen = "title";
                }
            }
            
        })

        function findWand(){
            ctx.save();
            ctx.translate(800, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 800, 600);
            ctx.restore();

            const frame = ctx.getImageData(0, 0, 800, 600);
            const data = frame.data;
            let count = 0;
            let sumX = 0;
            let sumY = 0;

            for (let i = 0; i < data.length; i += 4){
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const diff = Math.abs(r - wandColor.r) + Math.abs(g - wandColor.g) + Math.abs(b - wandColor.b);
                
                const pixel = i / 4;
                const x = pixel % 800;
                const y = Math.floor(pixel / 800);

                const dx = x - wandX;
                const dy = y - wandY;
                const near = dx * dx + dy * dy < searchR * searchR;

                if (diff < tolerance && (near || wandLost == true)){
                    count += 1;
                    sumX += x;
                    sumY += y;
                }
            }

            const wasLost = wandLost;

            if (count < miniPixels){
                wandLost = true;
            } else {
                wandLost = false;

                const targetX = sumX / count;
                const targetY = sumY / count;

                wandX = wandX + (targetX - wandX) * smooth;
                wandY = wandY + (targetY - wandY) * smooth;
            }

            if(wandLost == true && wasLost == false){
                say("Where's your wand?");
            }
        }

        function startCamera(){
            if(video.srcObject){
                return;
            }
            navigator.mediaDevices.getUserMedia({ video:true}).then(function (stream){
            video.srcObject = stream;
            video.play();
            });
        }

        function drawTitle(){
            ctx.fillStyle = "skyblue";
            ctx.fillRect(0, 0, 800, 600);

            ctx.fillStyle = "black";
            ctx.font = "60px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(title, 400, 100);

            ctx.fillStyle = "pink";
            ctx.fillRect(150, 250, 220, 100);
            ctx.fillStyle = "white";
            ctx.font = "40px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("📖 Words", 260, 300);

            ctx.fillStyle = "pink";
            ctx.fillRect(430, 250, 220, 100);
            ctx.fillStyle = "white";
            ctx.font = "40px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("➕ Math", 540, 300);
        }

        function questionText(){
            const q = questions[current];
            if(q.ask){
                return q.ask;
            }
            return "Can you find the " + q.word + "?";
        }

        function nextSet(){
            if (mode == "maths"){
                return makeMathsSet();
            }
            return wordSets[(level - 1) % wordSets.length];
        }

        function drawScan(){
            ctx.save();
            ctx.translate(800, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 800, 600);
            ctx.restore();

            const box = ctx.getImageData(circleX - circleR, circleY - circleR, circleR * 2, circleR * 2)
            const data = box.data;

            let sumR = 0;
            let sumG = 0;
            let sumB = 0;
            let count = 0;

            for (let i = 0; i < data.length; i += 4){
                const pixel = i / 4;
                const x = pixel % (circleR * 2);
                const y = Math.floor(pixel / (circleR * 2));

                const dx = x - circleR;
                const dy = y - circleR;

                if(dx * dx + dy * dy <  circleR * circleR){
                    sumR += data[i];
                    sumG += data[i + 1];
                    sumB += data[i + 2];
                    count += 1;

                    //data[i] = 0;
                    //data[i + 1] = 255;
                    //data[i + 2] = 0;
                }
            }
            //ctx.putImageData(box, circleX - circleR, circleY - circleR);
            if(video.videoWidth > 0){
                scanTimer += 1;
            }

            const avgR = Math.round(sumR/count);
            const avgG = Math.round(sumG/count);
            const avgB = Math.round(sumB/count);

            if(scanTimer >= 180){
                wandColor = {r: avgR, g: avgG, b: avgB};
                screen = "play";
                console.log(wandColor);
                say(questionText());
            }

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Scan your wand!", 400, 200);

            const secondsLeft = Math.ceil((180 - scanTimer) / 60);
            ctx.fillText(secondsLeft, 400, 450);

            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgb("+ avgR + "," + avgG + "," + avgB + ")";
            ctx.fillRect(20, 20, 60, 60);
        }

        function drawLevelUp(){

            ctx.fillStyle = "gold";
            ctx.fillRect(0, 0, 800, 600);

            ctx.fillStyle = "white";
            ctx.font = "40px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Level complete!", 400, 300);
            ctx.fillText("Level " + level, 400, 360);
            levelTimer -= 1;
            if(levelTimer <= 0){
                screen = "play";
                for (let a of apples){
                    resetApple(a);
                }
                say(questionText());
            }
        }

        function drawEnd(){
            ctx.fillStyle = "gold";
            ctx.fillRect(0, 0, 800, 600);

            ctx.fillStyle = "white";
            ctx.font = "60px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("You did it!", 400, 200);
            ctx.font = "40px sans-serif";
            ctx.fillText("⭐ Stars: " + score, 400, 300);
            ctx.fillText("Levels: " + maxLevel, 400, 360);
            ctx.fillText("Mistakes: " + mistakes, 400, 420);

            ctx.fillStyle = "pink";
            ctx.fillRect(290, 470, 220, 100);
            ctx.fillStyle = "white";
            ctx.font = "40px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Play again", 400, 520);

        }

        function resetApple(a){
            a.y = Math.random() * -50;
            a.x = 100 + Math.random() * 600;
        }

        function say(text){
            speechSynthesis.cancel();
            const line = new SpeechSynthesisUtterance(text);
            line.rate = 0.9;
            speechSynthesis.speak(line);
        }

        function dealWords(){
            const right = questions[current].word;
            const lucky = Math.floor(Math.random() * apples.length);

            for(let i = 0; i < apples.length; i += 1){
                if (i == lucky){
                    apples[i].word = right;
                } else {
                    apples[i].word = pickWrong();
                }
            }
        }
        
        function makeMathsSet(){
            const set = [];
            for (let i = 0; i < 3; i += 1){
                const a = 1 + Math.floor(Math.random() * 5);
                const b = 2 + Math.floor(Math.random() * 4);
                set.push({
                    word: String(a + b),
                    pic: a + " + " + b,
                    ask: "What is " + a + " plus " + b + "?"
                });
            }
            return set;
        }

        function pickWrong(){
            const right = questions[current].word;
            if (questions[current].ask){
                let w = right;
                while(w == right){
                    w = String(1 + Math.floor(Math.random() * 10));
                }
                return w;
            }
            let w = right;
            while(w == right){
                w = questions[Math.floor(Math.random() * questions.length)].word;
            }
            return w;
        }

        function update(){
            if (feedbackTimer > 0){
                feedbackTimer -= 1;
            }
            for (let a of apples){
                if (a == heldApple){
                    a.x = wandX;
                    a.y = wandY;
                    if(a.y > 450 && a.x > basketX - 50 && a.x < basketX + 50){
                        if(a.word == questions[current].word){
                            score += 1;
                            current += 1;
                            feedbackText = "Great job!";
                            feedbackTimer = 60;

                            if(current >= questions.length){
                                current = 0;
                                level += 1;
                                if (level > maxLevel){
                                    screen = "end";
                                    say("You did it! Well done!");
                                } else { 
                                    questions = nextSet();
                                    screen = "levelup";
                                    levelTimer = 120;
                                    say("Level complete!");
                                }
                            } else {
                                say(feedbackText + " " + questionText());
                            }
                            dealWords();
                            resetApple(a);
                        } else {
                            feedbackText = "Try again!";
                            feedbackTimer = 60;
                            a.rotten = true;
                            mistakes += 1;
                            say(feedbackText);
                        }
                        heldApple = null;
                    }
                } else {
                    a.y = a.y + a.speed + (level - 1) * speedUp;

                    const dx = a.x - wandX;
                    const dy = a.y - wandY;
                    a.hover = heldApple == null && dx * dx + dy * dy < grabR * grabR && a.rotten == false;
                
                    if(a.hover == true){
                        a.hold += 1;
                    } else {
                        a.hold = 0;
                    }

                    if (a.hold >= grabTime && heldApple == null){
                        heldApple = a;
                        a.hold = 0;
                        a.hover = false;
                        say(a.word);
                    }


                    if (a.y > 500){
                        resetApple(a);
                        a.rotten = false;
                    }
                }
            }
        }

        function draw(){
            ctx.fillStyle = skies[(level - 1) % skies.length];
            ctx.fillRect(0, 0, 800, 600);

            ctx.fillStyle = "limegreen";
            ctx.fillRect(0, 500, 800, 100);

            const barX = 250;
            const barY = 15;
            const barW = 300;
            const barH = 20;

            ctx.fillStyle = "lightgray";
            ctx.fillRect(barX, barY, barW, barH);

            ctx.fillStyle = "gold";
            ctx.fillRect(barX, barY, barW * current / questions.length, barH);

            ctx.font = "80px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(questions[current].pic, 400, 100);

            ctx.fillStyle = "black";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            if(questions[current].ask){
                ctx.fillText("Find the answer!", 400, 160);
            } else {
                ctx.fillText("What word is this?", 400, 160);
            }

            for (let a of apples){
                if(a.rotten == true){
                    ctx.fillStyle = "sienna";
                } else{
                    ctx.fillStyle = "red";
                }
                ctx.beginPath();
                ctx.arc(a.x, a.y, 25, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "white";
                ctx.font = "20px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(a.word, a.x, a.y);

                if (a.hover == true){
                    ctx.strokeStyle = "gold";
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    const progress = a.hold / grabTime;
                    ctx.arc(a.x, a.y, grabR, -Math.PI / 2, - Math.PI/ 2 + Math.PI * 2 * progress);
                    ctx.stroke();
                }
            }

            ctx.fillStyle = "saddlebrown";
            ctx.fillRect(basketX - 50, 470, 100, 30);

            ctx.fillStyle = "black";
            ctx.font = "40px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("⭐: " + score, 20, 40);

            if (feedbackTimer > 0){
                if(feedbackText == "Great job!"){
                    ctx.fillStyle = "green";
                } else {
                    ctx.fillStyle = "red";
                }
                ctx.font = "50px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(feedbackText, 400, 300);
            }

            if (wandLost == true){
                ctx.fillStyle = "rgb(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, 800, 600);
                ctx.fillStyle = "white";
                ctx.font = "50px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Where's your wand?", 400, 300);
            } else {
                ctx.fillStyle = "blue";
                ctx.beginPath();
                ctx.arc(wandX, wandY, 15, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            if (screen == "title"){
                drawTitle();
            } else if (screen == "scan"){
                drawScan();
            } else if(screen == "play"){
                findWand();
                if(wandLost == false){
                    update();
                }
                draw();
            } else if(screen == "levelup"){
                drawLevelUp();
            } else if(screen == "end"){
                drawEnd();
            }
            requestAnimationFrame(loop);
        }
        for (let a of apples){
            resetApple(a);
        }
        
        dealWords();
        loop();   
    </script>

</body>
</html>
